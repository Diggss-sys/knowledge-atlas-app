<!DOCTYPE html>
<html lang="en">
<!-- Root redirect for GitHub Pages in "deploy from branch" mode: the site serves the whole repo,
     and without this file the default Jekyll builder renders README.md as the homepage. The team
     hub lives in team_hub/ — send visitors there. (If Pages is ever switched to the "GitHub
     Actions" source, the workflow serves team_hub/ AS the site root and this file simply isn't
     part of the deployed artifact.) -->
<head>
  <meta charset="utf-8">
  <title>Knowledge Atlas Team Hub</title>
  <meta http-equiv="refresh" content="0; url=./team_hub/">
  <link rel="canonical" href="./team_hub/">
</head>
<body>
  <p>Redirecting to the <a href="./team_hub/">Knowledge Atlas Team Hub</a>&hellip;</p>
</body>
</html>
