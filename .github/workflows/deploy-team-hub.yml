name: Deploy Team Hub to GitHub Pages

on:
  # MANUAL ONLY (deliberate): GitHub Pages on this repo would publish the team's names and plans
  # to the public internet. Deploys wait on an explicit team decision — run from the Actions tab
  # when that decision is made. Do not re-add push triggers without asking Paco.
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire team_hub repository
          path: './team_hub'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
